server.port=8080
server.servlet.contextPath=/btc
spring.datasource.url=jdbc:h2:file:./data/bitcoindb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=bitcoin_exchange
spring.datasource.password=bitcoin_exchange
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true
spring.main.allow-bean-definition-overriding=true
management.metrics.web.server.auto-time-requests=false



logging.level: DEBUG
logging.level.org.hibernate: ERROR



realTime.exchangeAPI = https://min-api.cryptocompare.com/data/price
historical.exchangeAPI = https://min-api.cryptocompare.com/data/v2/histoday
exchangeRate.check.periodInMilliseconds = 10000

cors.allowedOrigins = http://localhost:3000

websocket.maxActivePairs = 50

cache.liveRates.ttlSeconds = 15
