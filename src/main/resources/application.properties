server.port=8080
server.servlet.contextPath=/btc
spring.datasource.url=jdbc:h2:file:./data/bitcoindb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=bitcoin_exchange
spring.datasource.password=bitcoin_exchange
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true
spring.main.allow-bean-definition-overriding=true
management.metrics.web.server.request.autotime.enabled=false



logging.level.root=DEBUG
logging.level.org.hibernate: ERROR



realTime.exchangeAPI = https://min-api.cryptocompare.com/data/price
historical.exchangeAPI = https://min-api.cryptocompare.com/data/v2/histoday
exchangeRate.check.periodInMilliseconds = 10000

cors.allowedOrigins = http://localhost:3000,http://localhost:5173

websocket.maxActivePairs = 50

cache.liveRates.ttlSeconds = 15

# Free, keyless live-rate provider (fiat only) - primary path for live rates, falling back to
# realTime.exchangeAPI above for bases it doesn't support (e.g. crypto) or when it's unreachable.
externalRatesApi.baseUrl = https://open.er-api.com/v6/latest
# The provider only refreshes once every 24h, so responses are cached per base currency for
# that long to stay within its free-tier usage guidance instead of calling it on every request.
externalRatesApi.cache.ttlSeconds = 86400

# Replaces the old @HystrixCommand on /historicalRate. Exceptions listed here bypass the
# fallback and propagate to the client as themselves (same semantics as Hystrix's ignoreExceptions).
resilience4j.circuitbreaker.instances.historicalRate.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.historicalRate.failureRateThreshold=50
resilience4j.circuitbreaker.instances.historicalRate.waitDurationInOpenState=60s
resilience4j.circuitbreaker.instances.historicalRate.ignoreExceptions=com.assignment.sm.exception.InvalidInputException,com.assignment.sm.exception.CurrencyNotFoundException,com.assignment.sm.exception.ExchangeRateSaveException,com.assignment.sm.exception.ExchangeRateFetchException,com.assignment.sm.exception.HistoricalRateUnavailableException
